<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 850" role="img" aria-labelledby="r12-title r12-desc">
<title id="r12-title">Rung-12 selected-candidate Pareto analysis with top pair and triple oracles</title>
<desc id="r12-desc">Rungs zero through twelve only. Nine selected candidates, including three local candidates, plus the three lowest-objective pair oracles and three lowest-objective triple oracles.</desc>
<metadata>Generated 2026-08-02 from pgx-mcts-bench commit a3367badf92353ed521e9e1c879536f0dc4e12a8 and current local artifacts. Rung records 13 and above excluded. Local partial coverage: s-tape4 12 of 13 ratio-10 records, s-triad-wst 12 of 13, s-scan-gru-tape2 9 of 13.</metadata>
