[project]
name = "pgx-mcts-bench"
version = "0.1.0"
description = "Fixed-compute AlphaZero, MuZero, and MCTS exploration benchmarks on Pgx games"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Artem Vorozhtsov" }]
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26",
  "pgx>=2.6.0",
  "torch>=2.3",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
pgx-mcts-bench = "pgx_mcts_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgx_mcts_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

